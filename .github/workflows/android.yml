name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'scripts/build-pjsip-android.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build-pjsip-android.sh'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  pjsip:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and build tools
        run: |
          sdkmanager 'ndk;27.2.12479018'
          sudo apt-get update
          sudo apt-get install -y build-essential git swig
      - name: Build PJSIP and official PJSUA2 JNI bindings
        env:
          PJSIP_VERSION: '2.15.1'
          TARGET_ABI: arm64-v8a
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x scripts/build-pjsip-android.sh
          ./scripts/build-pjsip-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tk-pjsip-android-arm64
          path: android/app/build/pjsip/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: pjsip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: tk-pjsip-android-arm64
          path: android/app/build/pjsip/
      - name: Build Android APK with PJSIP native libraries
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TK-App-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
